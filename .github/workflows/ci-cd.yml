name: GMF Investments CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  test-and-build:
    name: Test & Build Pipeline
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install statsmodels scipy matplotlib pandas python-docx scikit-learn pytest

      - name: Run Data Contract & Unit Tests
        run: |
          python -m unittest discover tests

      - name: Execute End-to-End Quantitative Pipeline
        run: |
          python main.py

      - name: Validate Generated Reports & Logs
        run: |
          test -f reports/GMF_Investments_Technical_Note.docx
          test -f GMF_Investments_Technical_Note.docx
          test -f logs/experiment_log.json

      - name: Upload Technical Report Artifacts
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: GMF-Investments-Technical-Note-DOCX
          path: |
            GMF_Investments_Technical_Note.docx
            reports/GMF_Investments_Technical_Note.docx
            logs/experiment_log.json
            reports/figures/
